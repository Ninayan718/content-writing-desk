<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="写作台">
<meta name="theme-color" content="#FCF9F4">
<title>内容写作台</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
:root{--bg:#FCF9F4;--surface:#FFFFFF;--line:#E9E2D6;--line2:#D8CFC0;--text:#2F2B26;--muted:#8A8175;--accent:#A8552A;--accent-soft:#F6E9DE;--ok:#2F7D5D;--ok-soft:#E7F2EC;--wait:#C8BFAF;--warn:#B78620;--radius:12px}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:78px}
h1,h2,h3,p{margin:0}
button,input,textarea{font-family:inherit}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:none;position:relative}
.brand-mark:after{content:"";position:absolute;left:6px;right:6px;top:6px;height:2px;background:#fff;box-shadow:0 5px 0 #fff}
.brand-name{font-size:15px;font-weight:600;white-space:nowrap}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;flex:none}

.btn{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#8E4622;color:#fff}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:#A33A2D}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

input[type=text],input[type=password],textarea{width:100%;min-width:0;max-width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:9px 10px;font-size:13px;color:var(--text);outline:none;line-height:1.65}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#B4AA9C}
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:10px}
.form-row{display:flex;gap:8px;align-items:center}
.form-row>*{min-width:0}
.form-row .grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.panels{max-width:1440px;margin:0 auto;padding:14px}
.panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;min-width:0}
.panel.active{display:block}
.panel-head{margin-bottom:14px}
.panel-head h2{font-size:15px;font-weight:600}
.panel-head p{font-size:12px;color:var(--muted);margin-top:2px}
.subhead{font-size:12.5px;font-weight:600;color:var(--text);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:12.5px;background:#FAF6F0;border-radius:8px}

.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-main{flex:1;min-width:0}
.list-title{font-size:13.5px;font-weight:500;word-break:break-word}
.list-detail{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-word;line-height:1.6}
.list-side{display:flex;gap:6px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:110px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.tag.you{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.idea{background:#F3EFE8;color:var(--muted);border-color:transparent}
.tag.doing{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--accent);margin-top:3px;cursor:pointer}

.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-dot{width:9px;height:9px;border-radius:50%;background:var(--wait);flex:none;margin-top:6px}
.step.done .step-dot{background:var(--ok)}
.step.running .step-dot{background:var(--accent)}
.step.pause .step-dot{background:var(--warn)}
.step-main{flex:1;min-width:0}
.step-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.step-name{font-size:13.5px;font-weight:500}
.step-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.step-status{font-size:11.5px;margin-top:4px;color:var(--muted)}
.step.done .step-status{color:var(--ok)}
.step.running .step-status{color:var(--accent)}
.step.pause .step-status{color:var(--warn)}
.log{background:#F7F3EC;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:#6B6257;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;line-height:1.7}
.progress-track{height:4px;background:#EFE8DC;border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .35s ease}

.wx-preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 16px;font-size:15px;line-height:1.85;color:#333;word-break:break-word}
.wx-preview .wx-title{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 18px;color:#222}
.wx-preview p{margin:0 0 1em}
.wx-fig{border:1px dashed var(--line2);background:#FBF7F0;border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:12px;margin:0 0 1em}
.meta-line{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}

details.tpl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#FDFBF7}
details.tpl summary{cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text)}
details.tpl textarea{margin-top:8px;min-height:130px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font-size:11.5px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar button.on{color:var(--accent)}
.ti{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;display:block;position:relative}
.ti:after{content:"";position:absolute;left:3px;right:3px;top:3px;height:1.5px;background:currentColor;box-shadow:0 4px 0 currentColor}
.ti-top{border-radius:50%}
.ti-wri:after{right:7px}
.ti-pip{border-radius:2px}
.ti-pip:after{left:2px;right:2px;top:6px;height:0;border-top:1.5px solid currentColor;background:none;box-shadow:none}
.ti-set{border-radius:50%}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#2F2B26;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;line-height:1.5}
.toast.show{opacity:1}

.modal{position:fixed;inset:0;background:rgba(47,43,38,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:88vh;overflow:auto;padding:18px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:15px;font-weight:600}
.modal-note{font-size:12px;color:var(--muted);margin:6px 0 12px;line-height:1.6}
#modalText{min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

@media (min-width:960px){
  body{padding-bottom:28px}
  .topbar-inner{padding:12px 18px}
  .panels{display:grid;grid-template-columns:280px minmax(0,1fr) 310px;gap:14px;align-items:start;padding:18px}
  .panel{display:block;margin:0}
  [data-panel="materials"]{grid-column:1;grid-row:1}
  [data-panel="more"]{grid-column:1;grid-row:2}
  [data-panel="topics"]{grid-column:2;grid-row:1}
  [data-panel="write"]{grid-column:2;grid-row:2}
  [data-panel="pipeline"]{grid-column:3;grid-row:1 / span 2}
  .tabbar{display:none}
  .toast{bottom:26px}
}
@media (max-width:520px){
  .topbar-inner{padding:9px 12px;gap:8px}
  .brand-sub{display:none}
  .top-actions .btn{padding:6px 9px;font-size:12px}
  .panels{padding:12px}
  .panel{padding:14px}
  .grid2{grid-template-columns:1fr}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">内容写作台</div>
        <div class="brand-sub" id="statLine">框架和终审你自己来，中间交给 AI</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" data-act="new-draft">新建草稿</button>
      <button class="btn primary" data-act="run-all">一键生成</button>
    </div>
  </div>
</header>

<main class="panels">
  <section class="panel" data-panel="materials">
    <div class="panel-head"><h2>素材库 · 真实经历</h2><p>只放你亲身做过的事，选题从这里出</p></div>
    <div id="materialsBody"></div>
  </section>

  <section class="panel" data-panel="topics">
    <div class="panel-head"><h2>选题池</h2><p>不追热点，从自己身上挖</p></div>
    <div id="topicsBody"></div>
  </section>

  <section class="panel" data-panel="write">
    <div class="panel-head"><h2>写作区</h2><p>框架你定，正文 AI 起，排版自动套</p></div>
    <div id="writeBody"></div>
  </section>

  <section class="panel" data-panel="pipeline">
    <div class="panel-head"><h2>流水线进度</h2><p>五步串联，每步都有回显</p></div>
    <div id="pipelineBody"></div>
  </section>

  <section class="panel" data-panel="more">
    <div class="panel-head"><h2>风格画像与设置</h2><p>让 AI 学你怎么写，而不是替你写</p></div>
    <div id="moreBody"></div>
  </section>
</main>

<nav class="tabbar" aria-label="页签导航">
  <button data-act="tab" data-tab="materials"><span class="ti ti-mat"></span>素材</button>
  <button data-act="tab" data-tab="topics"><span class="ti ti-top"></span>选题</button>
  <button data-act="tab" data-tab="write"><span class="ti ti-wri"></span>写作</button>
  <button data-act="tab" data-tab="pipeline"><span class="ti ti-pip"></span>流程</button>
  <button data-act="tab" data-tab="more"><span class="ti ti-set"></span>设置</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modalTitle">提示词</h3><button class="btn ghost" data-act="close-modal" aria-label="关闭">关闭</button></div>
    <p class="modal-note" id="modalNote"></p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
window.WD_CONTENT = {
  storageKey: 'writingDesk.v1',

  // 旧版默认画像（以及后来从 33 篇 AI 文里提炼出的画像）都已作废：
  // 那是从 AI 生成的文本里统计出来的模板痕迹，不是作者本人的写法。
  // 这里只留「去 AI 味的底线」，并明确标注未校准，引导去校准台采集本人语感。
  defaultProfile: {
    opening: '（未校准）从一个具体场景平实起句，不铺垫',
    evidence: '（未校准）只用我给的真实数字和经历，零编造',
    paragraph: '（未校准）短段，按语气自然分段',
    rhythm: '（未校准）顺着事情往下说，不套模板、不自问自答',
    ending: '（未校准）停在一件具体的事上，不升华',
    extra: '（未校准）不替我抒情、不替我下结论；不用💡、表格、小标题；不确定就留白'
  },

  steps: [
    { id: 'frame',  name: '定框架',   who: 'you', hint: '你只列要点，不写正文',      action: '检查框架' },
    { id: 'draft',  name: 'AI 初稿',  who: 'ai',  hint: '对齐风格画像生成正文',      action: '生成初稿提示词' },
    { id: 'layout', name: '配图排版', who: 'ai',  hint: '生成配图位并套公众号排版',  action: '生成配图提示词' },
    { id: 'review', name: '你终审',   who: 'you', hint: '查 AI 味、查编造、改回人味', action: '跑终审清单' },
    { id: 'push',   name: '推草稿箱', who: 'ai',  hint: '复制排版 HTML 供粘贴',       action: '复制排版 HTML' }
  ],

  promptTemplates: {
    profile: [
      '注意：不要用 AI 生成过的旧文来「提炼风格」，那样炼出来的只是模板腔。',
      '风格的来源是本人怎么说话，不是文章长什么样。',
      '',
      '下面是本人即时写下的一段口语（未润色）：',
      '',
      '{{CORPUS}}',
      '',
      '请只做客观记录，输出一个 JSON，字段固定为：',
      '{"opening":"","evidence":"","paragraph":"","rhythm":"","ending":"","extra":""}',
      '要求：每条写「可执行的写法」和「明确不要做的事」，不要评价文笔，不要替本人补情绪或结论，不要输出 JSON 以外的任何内容。'
    ].join('\n'),

    topics: [
      '我是公众号作者，领域是 {{DOMAIN}}。',
      '下面是我的真实经历素材：',
      '',
      '{{MATERIALS}}',
      '',
      '请基于这些素材给我 8 个公众号选题，要求：',
      '1. 每个都从我的真实经历出发，不追热点、不写宏观趋势。',
      '2. 标题口语化，用我给的数字，不许编造任何数字。',
      '3. 一行一个，只输出标题，不要编号、不要解释。'
    ].join('\n'),

    draft: [
      '我是公众号作者，领域是 {{DOMAIN}}。请按以下约束写初稿。',
      '',
      '【风格画像】{{PROFILE}}',
      '【素材】只能用我给的真实经历：{{MATERIALS}}。禁止编造数据、案例和经历。',
      '【框架】严格按这些要点展开，不新增章节：',
      '{{FRAMEWORK}}',
      '【选题】{{TOPIC}}',
      '',
      '【输出】只给正文，不要解释、不要总结、不要写「以下是」。',
      '段落长短、分节、是否用小标题，一律按上面的风格画像来，不要自行套模板。',
      '需要配图的地方单独写一行 [[配图: 画面描述]]；画像里若不要配图，就不写。'
    ].join('\n'),

    visual: [
      '为下面这篇公众号文章设计 3 张配图，每行一张，格式严格为 [[配图: 画面描述]]。',
      '风格：干净、扁平、无文字、适合手机竖屏。不要人物特写，不要水印，不要品牌标识。',
      '只输出这三行，不要解释。',
      '',
      '文章内容：',
      '{{BODY}}'
    ].join('\n'),

    review: [
      '你是我的终审编辑。按下面的风格画像审这篇稿子。',
      '只输出问题清单，一行一条，每条给出原句和建议改法；不要重写全文，不要夸奖，没有问题就写「无明显问题」。',
      '',
      '【风格画像】{{PROFILE}}',
      '【稿件】',
      '{{BODY}}'
    ].join('\n')
  },

  promptLabels: {
    profile: '从本人语感记录写法',
    topics: '基于素材出选题',
    draft: '写初稿',
    visual: '设计配图',
    review: '终审清单'
  },

  checks: [
    { id: 'slogan', label: '口号 / 套话', pattern: '综上所述|总而言之|首先|其次|最后|在这个.{0,6}时代|赋能|抓手|让我们一起|值得一提的是|不难看出', tip: '删掉，换成具体的说法' },
    { id: 'aiTone', label: 'AI 味开场', pattern: '以下是|希望对你有帮助|总结一下|总的来说|值得注意的是|在当今', tip: '直接删，正文应该自己开场' },
    { id: 'longPara', label: '超长段落', pattern: '__LONG_PARA__', tip: '按画像里的段落习惯拆短，别自行规定句式' },
    { id: 'noNumber', label: '没有真实数字', pattern: '__NO_NUMBER__', tip: '素材里若有真实数字别漏掉；没有就不要编' },
    { id: 'placeholder', label: '占位符没换掉', pattern: '__|^_+|待填|TODO|XXX', tip: '换成真实内容，别把占位带进成稿' }
  ],

  seedMaterials: [
    { id: 'm1', title: '小程序开发复盘', detail: '示例：上线 30 天，日活 __，流量主收入 __ 元。把 __ 换成你的真实数字。', tag: '产品', picked: false },
    { id: 'm2', title: '流量主日报', detail: '示例：连续记录 45 天，最高单日 __ 元。只写你真实记过的数。', tag: '数据', picked: false },
    { id: 'm3', title: '定投实验', detail: '示例：每月固定投入 __ 元，跑了 __ 个月，中途想停过一次。', tag: '理财', picked: false },
    { id: 'm4', title: '一人公司实践', detail: '示例：没有雇员，外包只花过 __ 元，最卡的一步是 __。', tag: '工作', picked: false }
  ],

  seedTopics: [
    { id: 't1', title: '把旧文搬到博客后，我想通了什么', status: 'idea' },
    { id: 't2', title: '我为什么不追热点了', status: 'idea' },
    { id: 't3', title: '一个人做产品，第 30 天的数据', status: 'idea' }
  ],

  seedFramework: [
    '先说背景：写稿流程一直很散',
    '我做了哪三件事',
    '一个我还没想通的地方',
    '结尾自然收，不喊口号'
  ].join('\n'),

  seedBody: [
    '先说说背景。',
    '',
    '公众号写了一年多，稿子攒了不少，但流程一直很散。',
    '',
    '选题靠刷手机，写稿靠临时起意，排版每次都要重来一遍。',
    '',
    '我就想，能不能让 AI 把这套流程接管了，而且还能学我的风格？'
  ].join('\n'),

  about: '流程照「定框架 → AI 初稿 → 配图排版 → 你终审 → 推草稿箱」串起来。框架和终审你自己来，中间交给 AI。默认不接任何付费服务：点生成会拼好提示词并复制，去 WorkBuddy 跑完把结果粘回来即可。'
};

(function () {
  'use strict';

  var C = window.WD_CONTENT;
  var KEY = C.storageKey;
  var TABS = ['materials', 'topics', 'write', 'pipeline', 'more'];
  var PF_FIELDS = [
    { k: 'opening', label: '开场' },
    { k: 'evidence', label: '论据' },
    { k: 'paragraph', label: '段落' },
    { k: 'rhythm', label: '节奏' },
    { k: 'ending', label: '结尾' },
    { k: 'extra', label: '额外约束' }
  ];

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function today() {

    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function newDraft() {
    return { id: uid(), title: '未命名草稿', framework: '', body: '', createdAt: Date.now(), updatedAt: Date.now(), pushed: false };
  }

  function defaultState() {
    var d = newDraft();
    d.title = '把旧文搬到博客后，我想通了什么';
    d.framework = C.seedFramework;
    d.body = C.seedBody;
    return {
      v: 1,

      topics: C.seedTopics.map(function (x) { return Object.assign({}, x); }),
      drafts: [d],
      activeDraftId: d.id,
      profile: Object.assign({}, C.defaultProfile),
      templates: Object.assign({}, C.promptTemplates),
      pipeline: { step: 0, statuses: {}, logs: [] },

  }

  function load() {
    var d = defaultState();
    try {
      var raw = localStorage.getItem(KEY);

      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return d;
      Object.keys(d).forEach(function (k) { if (s[k] === undefined || s[k] === null) s[k] = d[k]; });
      PF_FIELDS.forEach(function (f) { if (s.profile[f.k] === undefined) s.profile[f.k] = d.profile[f.k]; });
      Object.keys(C.promptTemplates).forEach(function (k) { if (!s.templates[k]) s.templates[k] = C.promptTemplates[k]; });
      if (!s.drafts.length) s.drafts = [newDraft()];
      if (!s.drafts.some(function (x) { return x.id === s.activeDraftId; })) s.activeDraftId = s.drafts[0].id;
      if (!s.pipeline.statuses) s.pipeline.statuses = {};
      if (!s.pipeline.logs) s.pipeline.logs = [];
      if (TABS.indexOf(s.tab) < 0) s.tab = 'write';
      return s;
    } catch (e) { return d; }
  }

  var state = load();
  var modalAction = null;
  var running = false;
  var toastTimer = null;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('记录不会保存：浏览器存储不可用'); return false; }
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }
  function draft() { return state.drafts.filter(function (x) { return x.id === state.activeDraftId; })[0] || state.drafts[0]; }
  function charCount() { return (draft().body || '').replace(/\s/g, '').length; }

  function copy(text, msg) {
    function done() { toast(msg || '已复制到剪贴板'); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) done();
      else openModal({ title: '手动复制', note: '浏览器不允许自动复制，请全选下面的内容手动复制。', text: text, readOnly: true });
    }
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }
  function download(text, filename, type) {
    var blob = new Blob([text], { type: (type || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function openModal(o) {
    $('#modalTitle').textContent = o.title || '提示词';
    $('#modalNote').textContent = o.note || '';
    var ta = $('#modalText');
    ta.value = o.text || '';
    ta.readOnly = !!o.readOnly;
    $('#modalFoot').innerHTML = o.foot || '<button class="btn ghost" data-act="close-modal">关闭</button>';
    modalAction = o.onSave || null;
    $('#modal').hidden = false;
    setTimeout(function () { ta.focus(); }, 0);
  }
  function closeModal() { $('#modal').hidden = true; modalAction = null; }
  function openPaste(o) {
    openModal({
      title: o.title, note: o.note || '', text: o.text || '',
      foot: '<button class="btn primary" data-act="modal-save">' + (o.label || '导入') + '</button><button class="btn ghost" data-act="close-modal">取消</button>',
      onSave: o.onSave
    });
  }

  function pickedMaterials() {
    var arr = state.materials.filter(function (m) { return m.picked; });
    if (!arr.length) arr = state.materials;
    if (!arr.length) return '（素材库还是空的，先去素材页加几条真实经历）';
    return arr.map(function (m, i) { return (i + 1) + '. ' + m.title + '：' + (m.detail || ''); }).join('\n');
  }
  function profileText() {
    var p = state.profile;
    return PF_FIELDS.map(function (f) { return f.label + '：' + (p[f.k] || ''); }).join('\n');
  }
  function fill(tpl, vars) {
    return tpl.replace(/\{\{(\w+)\}\}/g, function (_, k) { return vars[k] === undefined ? '' : vars[k]; });
  }
  function buildPrompt(key, extra) {
    var d = draft();
    var vars = {
      DOMAIN: state.domain,
      CORPUS: (extra && extra.corpus) || '（把 20 篇以上够长的旧文粘贴到这里）',
      MATERIALS: pickedMaterials(),
      PROFILE: profileText(),
      FRAMEWORK: d.framework || '（框架还没填，先去写作区列要点）',
      TOPIC: d.title || '（还没定选题）',
      BODY: d.body || '（正文还是空的）'
    };
    return fill(state.templates[key] || C.promptTemplates[key], vars);
  }
  function showPrompt(key, note) {
    var foot = '<button class="btn primary" data-act="modal-copy">复制提示词</button>';
    if (key === 'draft') foot += '<button class="btn" data-act="paste-draft">粘贴初稿</button>';
    if (key === 'topics') foot += '<button class="btn" data-act="paste-topics">粘贴选题</button>';
    if (key === 'visual') foot += '<button class="btn" data-act="paste-visual">粘贴配图位</button>';
    if (key === 'profile') foot += '<button class="btn" data-act="paste-profile">粘贴画像 JSON</button>';
    foot += '<button class="btn ghost" data-act="close-modal">关闭</button>';
    openModal({
      title: C.promptLabels[key] || '提示词',
      note: note || '改完点复制，去 WorkBuddy 跑一遍，把结果粘回来。',
      text: buildPrompt(key), foot: foot
    });
  }

  function bodyBlocks(body) {
    return String(body || '').split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function figMatch(b) { return b.match(/^\[\[配图[:：]\s*(.+?)\]\]$/); }
  function previewHTML() {
    var d = draft(), blocks = bodyBlocks(d.body);
    var h = '<h1 class="wx-title">' + esc(d.title || '未命名草稿') + '</h1>';
    if (!blocks.length) h += '<p style="color:#B4AA9C">正文还是空的，写完这里会实时排版。</p>';
    blocks.forEach(function (b) {
      var m = figMatch(b);
      if (m) h += '<div class="wx-fig">配图位 · ' + esc(m[1]) + '</div>';
      else h += '<p>' + esc(b).replace(/\n/g, '<br>') + '</p>';
    });
    return h;
  }
  function exportHTML() {
    var d = draft();
    var h = '<section style="font-size:16px;line-height:1.85;color:#333;letter-spacing:.3px;">';
    h += '<h1 style="font-size:20px;font-weight:600;line-height:1.5;margin:0 0 20px;">' + esc(d.title) + '</h1>';
    bodyBlocks(d.body).forEach(function (b) {
      var m = figMatch(b);
      if (m) h += '<p style="margin:0 0 20px;padding:16px;text-align:center;color:#999;background:#FAF6F0;border:1px dashed #D8CFC0;font-size:13px;">配图位：' + esc(m[1]) + '</p>';
      else h += '<p style="margin:0 0 1.2em;">' + esc(b).replace(/\n/g, '<br>') + '</p>';
    });
    return h + '</section>';
  }
  function fullHTML() {
    return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(draft().title) + '</title></head><body style="margin:0;padding:24px 16px;background:#fff;"><div style="max-width:680px;margin:0 auto;">' + exportHTML() + '</div></body></html>';
  }
  function markdown() {
    var d = draft();
    return '# ' + d.title + '\n\n' + bodyBlocks(d.body).map(function (b) {
      var m = figMatch(b);
      return m ? '> 配图位：' + m[1] : b.replace(/\n/g, '  \n');
    }).join('\n\n') + '\n';
  }

  function localReview() {
    var d = draft(), body = d.body || '', issues = [];
    C.checks.forEach(function (rule) {
      if (rule.pattern === '__LONG_PARA__') {
        var longs = bodyBlocks(body).filter(function (b) { return b.length > 90; });
        if (longs.length) issues.push('超长段落 ' + longs.length + ' 处（>90 字）：「' + longs[0].slice(0, 24) + '…」→ 按画像里的段落习惯拆短');
        return;
      }
      if (rule.pattern === '__NO_NUMBER__') {
        if (!/\d/.test(body)) issues.push('全文没有数字 → 素材里若有真实数字别漏掉，没有就不要编');
        return;
      }
      var hits = body.match(new RegExp(rule.pattern, 'gm'));
      if (hits && hits.length) issues.push(rule.label + '：命中 ' + hits.length + ' 处（' + hits.slice(0, 3).join('、') + '）→ ' + rule.tip);
    });
    if (!(d.framework || '').trim()) issues.push('框架是空的 → 框架应该你自己定，不能交给 AI');
    if (!issues.length) return '本地检查：无明显问题。再通读一遍，把不像你说话的句子改掉。';
    return '本地检查发现 ' + issues.length + ' 项：\n' + issues.map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n');
  }

  function hasApi() {
    var s = state.settings;
    return !!(s.useApi && s.apiKey && s.apiBase && s.model);
  }
  function callLLM(prompt) {
    if (!hasApi()) return Promise.resolve(null);
    var s = state.settings;
    return fetch(s.apiBase.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey },
      body: JSON.stringify({ model: s.model, messages: [{ role: 'user', content: prompt }], temperature: 0.8 })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || null;
    }).catch(function (e) {
      log('接口调用失败（' + e.message + '），已回退到提示词包。');
      return null;
    });
  }

  function log(msg) {
    var t = new Date();
    var hh = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
    state.pipeline.logs.push({ t: hh, msg: msg });
    if (state.pipeline.logs.length > 40) state.pipeline.logs.shift();
    save(); renderPipeline();
  }
  function setStep(id, status, text) {
    state.pipeline.statuses[id] = { status: status, text: text || '', at: Date.now() };
    save(); renderPipeline();
  }

  function doStep(id, auto) {
    var d = draft();
    if (id === 'frame') {
      var lines = (d.framework || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!lines.length) {
        if (!auto) { go('write'); toast('先在写作区列几条框架要点'); }
        return Promise.resolve({ status: 'pause', text: '框架还没填，先去写作区列要点' });
      }
      return Promise.resolve({ status: 'done', text: '框架已定：' + lines.length + ' 个要点，你主导' });
    }
    if (id === 'draft') {
      if (!auto) { showPrompt('draft'); return Promise.resolve(null); }
      if (hasApi()) {
        return callLLM(buildPrompt('draft')).then(function (out) {
          if (!out) {
            copy(buildPrompt('draft'), '初稿提示词已复制');
            return { status: 'pause', text: '接口没返回结果，提示词已复制，跑完粘回正文' };
          }
          d.body = out.trim(); d.updatedAt = Date.now(); save(); renderWrite(); renderStat();
          return { status: 'done', text: 'AI 初稿已写入正文，等你终审' };
        });
      }
      copy(buildPrompt('draft'), '初稿提示词已复制');
      return Promise.resolve({ status: 'pause', text: '提示词已复制：去 WorkBuddy 跑完，把初稿粘回正文' });
    }
    if (id === 'layout') {
      if (!auto) { showPrompt('visual'); return Promise.resolve(null); }
      copy(buildPrompt('visual'), '配图提示词已复制');
      renderWrite();
      return Promise.resolve({ status: 'done', text: '排版已刷新，3 张配图的提示词已复制' });
    }
    if (id === 'review') {
      var report = localReview();
      if (!auto) {
        openModal({
          title: '终审清单', note: '本地检查不联网。想让 AI 深度审，可复制终审提示词。', text: report, readOnly: true,
          foot: '<button class="btn primary" data-act="prompt-review">复制终审提示词</button><button class="btn ghost" data-act="close-modal">关闭</button>'
        });
        return Promise.resolve(null);
      }
      log(report);
      var bad = report.indexOf('无明显问题') < 0;
      return Promise.resolve(bad
        ? { status: 'pause', text: '终审发现待改项，明细见执行日志' }
        : { status: 'done', text: '终审通过，本地检查无明显问题' });
    }
    if (id === 'push') {
      copy(exportHTML(), '排版 HTML 已复制，去公众号后台粘贴');
      d.pushed = true; d.updatedAt = Date.now(); save(); renderWrite();
      return Promise.resolve({ status: 'done', text: '排版 HTML 已复制，草稿已标记推送' });
    }
    return Promise.resolve(null);
  }

  function runAll() {
    if (running) return;
    running = true;
    var btn = $('[data-act="run-all"]');
    $$('.btn.primary').forEach(function (b) { if (b.getAttribute('data-act') === 'run-all') b.disabled = true; });
    state.pipeline.logs = [];
    state.pipeline.statuses = {};
    save(); renderPipeline();
    var ids = C.steps.map(function (s) { return s.id; });
    var chain = Promise.resolve();
    ids.forEach(function (id, i) {
      chain = chain.then(function () {
        state.pipeline.step = i; save(); renderPipeline();
        setStep(id, 'running', '进行中…');
        return wait(260).then(function () { return doStep(id, true); }).then(function (res) {
          if (!res) return;
          setStep(id, res.status, res.text);
          log(C.steps[i].name + ' · ' + res.text);
        });
      });
    });
    chain.then(function () {
      state.pipeline.step = 5;
      save(); renderPipeline();
      running = false;
      $$('.btn.primary').forEach(function (b) { if (b.getAttribute('data-act') === 'run-all') b.disabled = false; });
      toast('五步跑完了，记得自己通读一遍再发');
      if (btn) btn.disabled = false;
    }).catch(function (e) {
      running = false;
      log('流程中断：' + e.message);
      $$('.btn.primary').forEach(function (b) { b.disabled = false; });
    });
  }

  function renderStat() {
    $('#statLine').textContent = '素材 ' + state.materials.length + ' · 选题 ' + state.topics.length +
      ' · 草稿 ' + state.drafts.length + ' · 当前 ' + charCount() + ' 字';
  }

  function renderMaterials() {
    var picked = state.materials.filter(function (m) { return m.picked; }).length;
    var h = '';
    h += '<div class="field"><label class="fl">新素材 · 标题</label><input type="text" id="matTitle" placeholder="例：小程序上线 30 天复盘"></div>';
    h += '<div class="field"><label class="fl">真实细节 · 数字别编</label><textarea id="matDetail" rows="2" placeholder="发生了什么、做了多久、具体数字是多少"></textarea></div>';
    h += '<button class="btn small" data-act="mat-add">添加素材</button>';
    h += '<div class="subhead">我的素材 <span class="tag' + (picked ? ' you' : '') + '">已选 ' + picked + ' 条</span></div>';
    if (!state.materials.length) h += '<div class="empty">还没有素材。先写 3 条你真实做过的事。</div>';
    state.materials.forEach(function (m) {
      h += '<div class="list-item"><input type="checkbox" data-act="mat-pick" data-id="' + m.id + '"' + (m.picked ? ' checked' : '') + '>' +
        '<div class="list-main"><div class="list-title">' + esc(m.title) + '</div><div class="list-detail">' + esc(m.detail) + '</div></div>' +
        '<div class="list-side"><span class="tag">' + esc(m.tag || '素材') + '</span><button class="btn small ghost danger" data-act="mat-del" data-id="' + m.id + '">删</button></div></div>';
    });
    h += '<p class="hint">勾选的素材会拼进选题和初稿提示词；一条不勾就用全部。示例里的 __ 是占位，换成你的真实数字。</p>';
    h += '<div class="btn-row"><button class="btn small" data-act="prompt-topics">生成选题提示词</button><button class="btn small" data-act="paste-topics">粘贴 AI 选题</button></div>';
    $('#materialsBody').innerHTML = h;
  }

  function renderTopics() {
    var h = '';
    h += '<div class="form-row"><input type="text" id="topicInput" class="grow" placeholder="自己想到一个选题"><button class="btn small" data-act="topic-add">加</button></div>';
    h += '<div class="subhead">选题池 <span class="tag">' + state.topics.length + ' 个</span></div>';

    $('#topicsBody').innerHTML = h;
  }

  function renderWrite() {
    var d = draft();
    var h = '';
    h += '<div class="field"><label class="fl">标题 / 当前选题</label><input type="text" id="dTitle" value="' + esc(d.title) + '"></div>';
    h += '<div class="field"><label class="fl">框架 · 你来定（一行一点）</label><textarea id="dFramework" rows="5" placeholder="先说背景&#10;我做了哪三件事&#10;一个还没想通的地方">' + esc(d.framework) + '</textarea></div>';
    h += '<div class="field"><label class="fl">正文 · AI 起稿，你终审</label><textarea id="dBody" rows="12" placeholder="一句话一段，段间空一行">' + esc(d.body) + '</textarea></div>';
    h += '<div class="meta-line"><span id="wordCount">' + charCount() + ' 字</span><span>' + bodyBlocks(d.body).length + ' 段</span><span>' + (d.pushed ? '已标记推送' : '未推送') + '</span></div>';
    h += '<div class="btn-row"><button class="btn small" data-act="prompt-draft">生成初稿提示词</button><button class="btn small" data-act="paste-draft">粘贴初稿</button><button class="btn small" data-act="paste-visual">插入配图位</button><button class="btn small" data-act="copy-md">复制 Markdown</button><button class="btn small" data-act="copy-html">复制排版 HTML</button><button class="btn small" data-act="download-html">下载 HTML</button></div>';
    h += '<div class="subhead">排版预览 <span class="tag">公众号样式</span></div>';
    h += '<div class="wx-preview" id="wxPreview">' + previewHTML() + '</div>';
    h += '<p class="hint">正文里单独写一行 <b>[[配图: 画面描述]]</b>，预览和导出会变成配图位。配图不接付费图床，只给可复制的画面提示词。</p>';
    $('#writeBody').innerHTML = h;
  }

  function renderPipeline() {
    var s = state.pipeline;
    var done = C.steps.filter(function (st) {
      var q = s.statuses[st.id];
      return q && (q.status === 'done' || q.status === 'pause');
    }).length;
    var h = '';
    h += '<div class="btn-row" style="margin-top:0"><button class="btn primary" data-act="run-all">一键生成</button><button class="btn" data-act="reset-pipeline">重置流程</button></div>';
    h += '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round(done / 5 * 100) + '%"></div></div>';
    h += '<p class="hint">' + done + '/5 步完成。橙点是需要你动手的环节，AI 环节会自动跑完；不接接口时，AI 环节会把提示词复制好等你粘结果。</p>';
    C.steps.forEach(function (st, i) {
      var q = s.statuses[st.id] || {};
      h += '<div class="step ' + esc(q.status || '') + '"><span class="step-dot"></span><div class="step-main">' +
        '<div class="step-top"><span class="step-name">' + (i + 1) + '. ' + st.name + '</span>' +
        '<span class="tag ' + (st.who === 'you' ? 'you' : '') + '">' + (st.who === 'you' ? '你主导' : 'AI 跑') + '</span></div>' +
        '<div class="step-hint">' + st.hint + '</div>' +
        (q.text ? '<div class="step-status">' + esc(q.text) + '</div>' : '') +
        '</div><button class="btn small" data-act="step" data-id="' + st.id + '">' + st.action + '</button></div>';
    });
    h += '<div class="subhead">执行日志</div>';
    h += '<div class="log" id="logBox">' + (s.logs.length
      ? esc(s.logs.map(function (l) { return '[' + l.t + '] ' + l.msg; }).join('\n'))
      : '还没跑过。点上面的「一键生成」，五步会依次执行并回显进度。') + '</div>';
    h += '<div class="subhead">输出</div>';
    h += '<div class="btn-row"><button class="btn small" data-act="copy-html">复制排版 HTML</button><button class="btn small" data-act="copy-md">复制 Markdown</button><button class="btn small" data-act="download-html">下载 HTML</button><button class="btn small" data-act="mark-pushed">标记已推送</button></div>';
    h += '<p class="hint">公众号草稿箱接口要开发者权限和服务器 IP 白名单，纯静态页做不到。这里先给你可直接粘贴进后台的排版 HTML。</p>';
    $('#pipelineBody').innerHTML = h;
  }

  function renderMore() {
    var h = '';
    h += '<div class="field"><label class="fl">你的领域（写进提示词）</label><input type="text" id="setDomain" value="' + esc(state.domain) + '"></div>';
    h += '<button class="btn small" data-act="save-domain">保存领域</button>';
    h += '<div class="subhead">风格画像</div>';
    PF_FIELDS.forEach(function (f) {
      h += '<div class="field"><label class="fl">' + f.label + '</label><input type="text" id="pf_' + f.k + '" value="' + esc(state.profile[f.k]) + '"></div>';
    });
    h += '<div class="btn-row"><button class="btn small" data-act="save-profile">保存画像</button><button class="btn small" data-act="reset-profile">恢复默认</button></div>';
    h += '<div class="btn-row"><button class="btn small primary" data-act="open-calibration">校准我的写法</button><button class="btn small" data-act="paste-profile">粘贴画像 JSON</button></div>';
    h += '<p class="hint">别再用 AI 生成过的旧文「提炼风格」了 —— 那样炼出来的只是模板腔。点「校准我的写法」，从你自己的说话方式采一次：说一段真话、做一组二选一、划清边界，生成能直接粘回来的画像 JSON。</p>';
    h += '<div class="divider"></div><div class="subhead">提示词模板</div>';
    h += '<p class="hint">字段用 {{大写英文}} 占位，保存后会立即生效。</p>';
    Object.keys(C.promptLabels).forEach(function (k) {
      h += '<details class="tpl"><summary>' + C.promptLabels[k] + '</summary><textarea data-tpl="' + k + '" rows="7">' + esc(state.templates[k]) + '</textarea></details>';
    });
    h += '<div class="btn-row"><button class="btn small" data-act="save-templates">保存模板</button><button class="btn small" data-act="reset-templates">恢复默认</button></div>';
    h += '<div class="divider"></div><div class="subhead">模型接口 · 可选</div>';
    h += '<label class="fl" style="display:flex;align-items:center;gap:7px"><input type="checkbox" data-act="set-useapi" style="width:16px;height:16px;margin:0"' + (state.settings.useApi ? ' checked' : '') + '>打开后由浏览器直接调接口写初稿</label>';
    h += '<div class="field"><label class="fl">接口地址（OpenAI 兼容）</label><input type="text" id="apiBase" value="' + esc(state.settings.apiBase) + '"></div>';
    h += '<div class="grid2"><div class="field"><label class="fl">模型名</label><input type="text" id="apiModel" value="' + esc(state.settings.model) + '"></div>' +
      '<div class="field"><label class="fl">API Key</label><input type="password" id="apiKey" value="' + esc(state.settings.apiKey) + '" placeholder="留空则用提示词包"></div></div>';
    h += '<button class="btn small" data-act="save-settings">保存接口设置</button>';
    h += '<p class="hint">默认关闭，零成本、零密钥：点生成只复制提示词，去 WorkBuddy 跑完粘回来。密钥只存在这台设备的浏览器里，公共电脑别填。</p>';
    h += '<div class="divider"></div><div class="subhead">数据</div>';
    h += '<div class="btn-row"><button class="btn small" data-act="export-json">导出备份 JSON</button><button class="btn small" data-act="import-json">导入备份</button><button class="btn small danger" data-act="clear-all">清空全部数据</button></div>';
    h += '<div class="divider"></div><p class="hint">' + esc(C.about) + '</p>';
    $('#moreBody').innerHTML = h;
  }

  function renderAll() {
    $$('.panel').forEach(function (p) { p.classList.toggle('active', p.getAttribute('data-panel') === state.tab); });
    $$('.tabbar button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === state.tab); });
    renderStat(); renderMaterials(); renderTopics(); renderWrite(); renderPipeline(); renderMore();
  }
  function go(tab) {
    if (TABS.indexOf(tab) < 0) return;
    state.tab = tab; save();
    try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; }
    renderAll();
  }
  function tabFromHash() {
    var t = location.hash.replace('#', '');
    return TABS.indexOf(t) >= 0 ? t : null;
  }

  function pasteTopics(v) {
    var lines = v.split('\n').map(function (s) {
      return s.trim().replace(/^\s*(?:\d+[\.、)]|[-*•])\s*/, '').trim();
    }).filter(function (s) { return s && s.length >= 2 && s.indexOf('{{') < 0; });
    var seen = {};
    state.topics.forEach(function (t) { seen[t.title] = 1; });
    var added = 0;
    lines.forEach(function (line) {
      if (seen[line]) return;
      seen[line] = 1;
      state.topics.push({ id: uid(), title: line, status: 'idea' });
      added++;
    });
    save(); renderTopics(); renderStat();
    toast(added ? '导入了 ' + added + ' 个选题' : '没有新选题，可能重复了');
  }
  function pasteDraft(v) {
    var t = v.trim();
    if (!t) { toast('内容为空'); return true; }
    var d = draft();
    d.body = t; d.updatedAt = Date.now();
    save(); renderWrite(); renderStat();
    toast('初稿已写入正文，记得自己终审');
  }
  function pasteVisual(v) {
    var lines = v.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return /^\[\[配图[:：]/.test(s); });
    if (!lines.length) { toast('没找到 [[配图: …]] 格式的行'); return true; }
    var d = draft(), blocks = bodyBlocks(d.body), out = [], k = 0;
    var inserts = lines.slice(0, 3);
    var stepN = Math.max(1, Math.floor(blocks.length / (inserts.length + 1)));
    blocks.forEach(function (b, i) {
      out.push(b);
      if (k < inserts.length && (i + 1) % stepN === 0) out.push(inserts[k++]);
    });
    while (k < inserts.length) out.push(inserts[k++]);
    d.body = out.join('\n\n'); d.updatedAt = Date.now();
    save(); renderWrite(); renderStat();
    toast('已把 ' + inserts.length + ' 个配图位均匀插进正文');
  }
  function pasteProfile(v) {
    try {
      var o = JSON.parse(v.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim());
      var n = 0;
      PF_FIELDS.forEach(function (f) {
        if (typeof o[f.k] === 'string' && o[f.k].trim()) { state.profile[f.k] = o[f.k].trim(); n++; }
      });
      if (!n) { toast('没读到有效字段，检查是不是那个 JSON'); return true; }
      save(); renderMore();
      toast('风格画像已更新 ' + n + ' 条');
    } catch (e) { toast('JSON 解析失败：' + e.message); return true; }
  }
  function pasteCorpus(v) {
    if (!v.trim()) { toast('旧文是空的'); return true; }
    var p = buildPrompt('profile', { corpus: v.trim() });
    copy(p, '画像提示词已复制，跑完把 JSON 粘回来');
    closeModal();
    setTimeout(function () {
      openPaste({
        title: '粘贴 AI 返回的风格画像',
        note: '把刚才那段提示词跑出来的 JSON 粘进来，会自动写进风格画像。',
        label: '导入画像', onSave: pasteProfile
      });
    }, 200);
  }
  function mergeState(o) {
    if (!o || typeof o !== 'object') throw new Error('不是有效的备份');
    ['materials', 'topics', 'drafts'].forEach(function (key) {
      if (!Array.isArray(o[key])) return;
      var seen = {};
      state[key].forEach(function (x) { seen[x.id] = 1; });
      o[key].forEach(function (x) {
        if (!x || !x.id || seen[x.id]) return;
        seen[x.id] = 1;
        state[key].push(x);
      });
    });
    if (o.profile) PF_FIELDS.forEach(function (f) { if (o.profile[f.k]) state.profile[f.k] = o.profile[f.k]; });
    if (o.templates) Object.keys(o.templates).forEach(function (k) { if (o.templates[k]) state.templates[k] = o.templates[k]; });
    if (o.domain) state.domain = o.domain;
    save(); renderAll();
  }

  function onAction(act, id, el) {
    var d, v, i;
    switch (act) {
      case 'tab': go(el.getAttribute('data-tab')); break;
      case 'new-draft':
        d = newDraft(); state.drafts.unshift(d); state.activeDraftId = d.id;
        state.pipeline.statuses = {}; state.pipeline.logs = [];
        save(); go('write'); toast('新草稿建好了，先列框架'); break;
      case 'mat-add':
        v = $('#matTitle').value.trim();
        if (!v) { toast('先写个素材标题'); break; }
        state.materials.unshift({ id: uid(), title: v, detail: $('#matDetail').value.trim(), tag: '素材', picked: true });
        save(); renderMaterials(); renderStat(); toast('素材已加入，并已勾选进提示词'); break;
      case 'mat-del':
        state.materials = state.materials.filter(function (m) { return m.id !== id; });
        save(); renderMaterials(); renderStat(); break;
      case 'topic-add':
        v = $('#topicInput').value.trim();
        if (!v) { toast('先写个选题'); break; }
        state.topics.unshift({ id: uid(), title: v, status: 'idea' });
        save(); renderTopics(); renderStat(); break;
      case 'topic-del':
        state.topics = state.topics.filter(function (t) { return t.id !== id; });
        save(); renderTopics(); renderStat(); break;
      case 'topic-use':
        var t = state.topics.filter(function (x) { return x.id === id; })[0];
        if (!t) break;
        d = draft(); d.title = t.title; d.updatedAt = Date.now();
        t.status = 'doing';
        state.topics.forEach(function (x) { if (x.id !== id && x.status === 'doing') x.status = 'idea'; });
        save(); go('write'); toast('已设为当前选题，去列框架吧'); break;
      case 'prompt-topics': showPrompt('topics'); break;
      case 'prompt-draft': showPrompt('draft'); break;
      case 'prompt-review': showPrompt('review'); break;
      case 'paste-topics':
        openPaste({ title: '粘贴 AI 返回的选题', note: '一行一个，自动去掉编号和重复项。', label: '导入选题', onSave: function (val) { pasteTopics(val); } }); break;
      case 'paste-draft':
        openPaste({ title: '粘贴初稿', note: '把 WorkBuddy 跑出来的正文整段粘进来，会覆盖当前正文。', label: '写入正文', onSave: pasteDraft }); break;
      case 'paste-visual':
        openPaste({ title: '粘贴配图位', note: '每行形如 [[配图: 画面描述]]，最多取 3 张，均匀插进正文。', label: '插入配图位', onSave: pasteVisual }); break;
      case 'paste-profile':
        openPaste({ title: '粘贴风格画像 JSON', note: '字段：opening / evidence / paragraph / rhythm / ending / extra。可用校准台生成的 JSON。', label: '导入画像', onSave: pasteProfile }); break;
      case 'open-calibration':
        location.href = 'style-calibration.html'; break;
      case 'paste-corpus':
        toast('别从旧文提炼了，点「校准我的写法」重新采一次'); break;
      case 'copy-md': copy(markdown(), 'Markdown 已复制'); break;
      case 'copy-html': copy(exportHTML(), '排版 HTML 已复制，可直接粘进公众号后台'); break;
      case 'download-html': download(fullHTML(), (draft().title || '草稿').slice(0, 24) + '-' + today() + '.html', 'text/html'); toast('HTML 已下载'); break;
      case 'mark-pushed':
        d = draft(); d.pushed = true; d.updatedAt = Date.now();
        save(); renderWrite(); toast('已标记为推送完成'); break;
      case 'run-all': runAll(); break;
      case 'reset-pipeline':
        state.pipeline = { step: 0, statuses: {}, logs: [] };
        save(); renderPipeline(); toast('流程已重置'); break;
      case 'step':
        doStep(id, false).then(function (res) {
          if (res) { setStep(id, res.status, res.text); log(C.steps.filter(function (s) { return s.id === id; })[0].name + ' · ' + res.text); }
        });
        break;
      case 'save-domain':
        state.domain = $('#setDomain').value.trim() || state.domain;
        save(); toast('领域已保存'); break;
      case 'save-profile':
        PF_FIELDS.forEach(function (f) { state.profile[f.k] = $('#pf_' + f.k).value.trim(); });
        save(); toast('风格画像已保存，之后生成的提示词会用它'); break;
      case 'reset-profile':
        state.profile = Object.assign({}, C.defaultProfile);
        save(); renderMore(); toast('已恢复默认画像'); break;
      case 'save-templates':
        $$('[data-tpl]').forEach(function (ta) { state.templates[ta.getAttribute('data-tpl')] = ta.value; });
        save(); toast('提示词模板已保存'); break;
      case 'reset-templates':
        state.templates = Object.assign({}, C.promptTemplates);
        save(); renderMore(); toast('模板已恢复默认'); break;
      case 'save-settings':
        state.settings.apiBase = $('#apiBase').value.trim();
        state.settings.model = $('#apiModel').value.trim();
        state.settings.apiKey = $('#apiKey').value.trim();
        save(); toast(hasApi() ? '接口已启用，一键生成会直接写初稿' : '已保存；没填全则仍走提示词包'); break;
      case 'export-json':
        download(JSON.stringify(state, null, 2), '写作台备份-' + today() + '.json', 'application/json');
        toast('备份已下载'); break;
      case 'import-json':
        openPaste({
          title: '导入备份 JSON', note: '按 id 去重合并素材、选题和草稿，不会覆盖现有内容。', label: '合并导入',
          onSave: function (val) {
            try { mergeState(JSON.parse(val)); toast('备份已合并'); }
            catch (e) { toast('导入失败：' + e.message); return true; }
          }
        }); break;
      case 'clear-all':
        if (window.confirm('清空全部素材、选题、草稿和设置？此操作不可撤销，建议先导出备份。')) {
          localStorage.removeItem(KEY);
          state = defaultState();
          save(); go('write'); toast('已恢复到初始状态');
        }
        break;
      case 'modal-copy': copy($('#modalText').value, '已复制到剪贴板'); break;
      case 'modal-save':
        if (modalAction) {
          var keep = modalAction($('#modalText').value);
          if (!keep) closeModal();
        }
        break;
      case 'close-modal': closeModal(); break;
      default: break;
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.tagName === 'INPUT') return;
    onAction(el.getAttribute('data-act'), el.getAttribute('data-id'), el);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'mat-pick') {
      var m = state.materials.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (m) { m.picked = el.checked; save(); renderMaterials(); }
    } else if (act === 'set-useapi') {
      state.settings.useApi = el.checked; save();
      toast(el.checked ? '接口已打开，记得填 Key 并保存' : '已切回提示词包模式');
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id, d = draft();
    if (id === 'dTitle') {
      d.title = e.target.value; d.updatedAt = Date.now(); save();
      var t = $('#wxPreview .wx-title'); if (t) t.textContent = d.title;
    } else if (id === 'dFramework') {
      d.framework = e.target.value; d.updatedAt = Date.now(); save();
    } else if (id === 'dBody') {
      d.body = e.target.value; d.updatedAt = Date.now(); save();
      var w = $('#wordCount'); if (w) w.textContent = charCount() + ' 字';
      var p = $('#wxPreview'); if (p) p.innerHTML = previewHTML();
      renderStat();
    }
  });
  window.addEventListener('hashchange', function () {
    var t = tabFromHash();
    if (t && t !== state.tab) { state.tab = t; save(); renderAll(); }
  });
  $('#modal').addEventListener('click', function (e) {
    if (e.target === $('#modal')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  });

  var initialTab = tabFromHash();
  if (initialTab) state.tab = initialTab;
  save();
  renderAll();
  window.__WD = {
    getState: function () { return state; },
    go: go,
    runAll: runAll,
    renderAll: renderAll,
    key: KEY
  };
})();

</script>
</body>
</html>
